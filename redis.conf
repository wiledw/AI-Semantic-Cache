# Redis persistence configuration

# RDB persistence (snapshots)
# Save the dataset to disk if at least one key changed and the given number of seconds passed
# Save after 900 sec if at least 1 key changed
save 900 1
# Save after 300 sec if at least 10 keys changed
save 300 10
# Save after 60 sec if at least 10000 keys changed
save 60 10000

# AOF persistence (Append Only File) - more durable
appendonly yes
# fsync every second (good balance between performance and durability)
appendfsync everysec

# Directory for persistence files
dir /data

# RDB filename
dbfilename dump.rdb

# AOF filename
appendfilename appendonly.aof
